spring.application.name=SP Monitor App

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/spmonitor
spring.datasource.username=postgres
spring.datasource.password=Ramah5656
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.address=0.0.0.0

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Log incoming HTTP requests (helps confirm phone is reaching backend)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
